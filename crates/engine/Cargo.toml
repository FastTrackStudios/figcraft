[package]
name = "figcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft engine: sessions, undo history, the command registry every surface (UI, CLI, control channel, MCP) dispatches through, pointer tools, components and the Figma menu catalog"

[lints]
workspace = true

[features]
# Upstream's defaults. A host that only edits documents (Frame) turns these off.
default = ["pdf", "plugins", "font-download", "vectordrawable"]
# PDF export (krilla).
pdf = ["dep:figcraft-pdf"]
# Running wasm plugins (wasmi). The plugin and widget types stay either way.
plugins = ["figcraft-plugin/sandbox"]
# Downloading a missing font (craft-font-store, desktop only).
font-download = ["dep:craft-font-store", "dep:craft-font-catalog"]
# Android VectorDrawable export.
vectordrawable = ["dep:figcraft-vectordrawable"]

[dependencies]
figcraft-geom = { workspace = true }
figcraft-color = { workspace = true }
figcraft-doc = { workspace = true }
figcraft-collab = { workspace = true }
figcraft-layout = { workspace = true }
figcraft-text = { workspace = true }
figcraft-pathops = { workspace = true }
figcraft-render = { workspace = true }
figcraft-format = { workspace = true }
figcraft-svg = { workspace = true }
figcraft-pdf = { workspace = true, optional = true }
figcraft-vectordrawable = { workspace = true, optional = true }
craft-docpath = { workspace = true }
figcraft-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
deunicode = { workspace = true }
same-file = { workspace = true }
web-time = "1.1.0"

# Downloading a missing font (desktop only; the web keeps its built-in fonts). The bundled index
# (~620 KB) lets the Missing fonts window tell which fonts can be downloaded without a request.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-font-store = { workspace = true, features = ["bundled-index"], optional = true }
craft-font-catalog = { workspace = true, optional = true }

[dev-dependencies]
figcraft-pdf = { workspace = true }
figcraft-vectordrawable = { workspace = true }
zip = { workspace = true }
wat = { workspace = true }
image = { workspace = true }
