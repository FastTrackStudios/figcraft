[package]
name = "figcraft-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft plugins: the plugin manifest and the WebAssembly sandbox plugins run in (a metered interpreter with no file system, network or clock)"

[lints]
workspace = true

[features]
# The wasmi sandbox that runs plugin modules. Off: the manifest, bundle and widget types stay, and no module runs.
default = ["sandbox"]
sandbox = ["dep:wasmi"]

[dependencies]
figcraft-color = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A bundle's SHA-256 (plugin directories list it; the app checks downloads against it).
sha2 = { workspace = true }
thiserror = { workspace = true }
wasmi = { workspace = true, optional = true }

[dev-dependencies]
wat = { workspace = true }
